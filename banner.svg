<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020c18;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#021a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#03111f;stop-opacity:1" />
    </linearGradient>

    <!-- Cyan glow gradient for text -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff" />
      <stop offset="50%" style="stop-color:#ffffff" />
      <stop offset="100%" style="stop-color:#00b4d8" />
    </linearGradient>

    <!-- Subtitle gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00b4d8" />
      <stop offset="100%" style="stop-color:#90e0ef" />
    </linearGradient>

    <!-- Scan line mask -->
    <clipPath id="scanClip">
      <rect x="0" y="0" width="900" height="200" />
    </clipPath>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00d4ff" stroke-width="0.2" opacity="0.15"/>
    </pattern>

    <!-- Corner bracket filter glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Scan line animation */
    @keyframes scan {
      0%   { transform: translateY(-10px); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(210px); opacity: 0; }
    }

    /* Pulse on corner brackets */
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50%       { opacity: 1; }
    }

    /* Horizontal slide-in for title */
    @keyframes slideIn {
      0%   { opacity: 0; transform: translateX(-30px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    /* Fade up for subtitle */
    @keyframes fadeUp {
      0%   { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Blink cursor */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* Floating dots */
    @keyframes float1 {
      0%, 100% { cy: 40px; opacity: 0.5; }
      50%       { cy: 32px; opacity: 1; }
    }
    @keyframes float2 {
      0%, 100% { cy: 160px; opacity: 0.3; }
      50%       { cy: 168px; opacity: 0.7; }
    }
    @keyframes float3 {
      0%, 100% { cy: 90px; opacity: 0.4; }
      50%       { cy: 82px; opacity: 0.9; }
    }

    /* Eye circle scanning ring */
    @keyframes ringPulse {
      0%   { r: 22; opacity: 0.8; }
      50%  { r: 28; opacity: 0.3; }
      100% { r: 22; opacity: 0.8; }
    }

    /* Dash flow on horizontal lines */
    @keyframes dashFlow {
      0%   { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -80; }
    }

    .scan-line {
      animation: scan 3.5s linear infinite;
    }
    .bracket { animation: pulse 2s ease-in-out infinite; }
    .title-text {
      animation: slideIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
    }
    .sub-text {
      animation: fadeUp 0.8s ease-out 0.8s both;
    }
    .tag-text {
      animation: fadeUp 0.8s ease-out 1.1s both;
    }
    .cursor {
      animation: blink 1.1s step-end infinite;
    }
    .dot1 { animation: float1 3s ease-in-out infinite; }
    .dot2 { animation: float2 2.7s ease-in-out infinite; }
    .dot3 { animation: float3 3.3s ease-in-out infinite; }
    .ring { animation: ringPulse 2.2s ease-in-out infinite; }
    .dash-line {
      stroke-dasharray: 6 4;
      animation: dashFlow 1.8s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bgGrad)" rx="10"/>

  <!-- Grid overlay -->
  <rect width="900" height="200" fill="url(#grid)" rx="10" opacity="0.6"/>

  <!-- Subtle vignette overlay -->
  <radialGradient id="vig" cx="50%" cy="50%" r="70%">
    <stop offset="60%" style="stop-color:#000000;stop-opacity:0"/>
    <stop offset="100%" style="stop-color:#000000;stop-opacity:0.45"/>
  </radialGradient>
  <rect width="900" height="200" fill="url(#vig)" rx="10"/>

  <!-- ═══ Decorative horizontal dashed lines ═══ -->
  <line class="dash-line" x1="0" y1="30" x2="280" y2="30" stroke="#00d4ff" stroke-width="0.6" opacity="0.4"/>
  <line class="dash-line" x1="620" y1="30" x2="900" y2="30" stroke="#00d4ff" stroke-width="0.6" opacity="0.4"/>
  <line class="dash-line" x1="0" y1="170" x2="280" y2="170" stroke="#00d4ff" stroke-width="0.6" opacity="0.4"/>
  <line class="dash-line" x1="620" y1="170" x2="900" y2="170" stroke="#00d4ff" stroke-width="0.6" opacity="0.4"/>

  <!-- ═══ Corner brackets — top left ═══ -->
  <g class="bracket" filter="url(#glow)">
    <polyline points="18,50 18,18 50,18" fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- top right -->
  <g class="bracket" filter="url(#glow)" style="animation-delay:0.5s">
    <polyline points="882,50 882,18 850,18" fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- bottom left -->
  <g class="bracket" filter="url(#glow)" style="animation-delay:0.25s">
    <polyline points="18,150 18,182 50,182" fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- bottom right -->
  <g class="bracket" filter="url(#glow)" style="animation-delay:0.75s">
    <polyline points="882,150 882,182 850,182" fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ═══ CV Eye / Lens icon (left side) ═══ -->
  <g transform="translate(100, 100)" filter="url(#glow)">
    <!-- Outer scanning ring -->
    <circle class="ring" cx="0" cy="0" r="22" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
    <!-- Iris -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#00b4d8" stroke-width="1.5" opacity="0.7"/>
    <!-- Pupil -->
    <circle cx="0" cy="0" r="8" fill="#00d4ff" opacity="0.15"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="2.5" fill="#00d4ff" opacity="0.9"/>
    <!-- Crosshair lines -->
    <line x1="-28" y1="0" x2="-20" y2="0" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
    <line x1="20" y1="0" x2="28" y2="0" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="-28" x2="0" y2="-20" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="20" x2="0" y2="28" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- ═══ CV Eye / Lens icon (right side) ═══ -->
  <g transform="translate(800, 100)" filter="url(#glow)" style="opacity:0.5">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#00b4d8" stroke-width="1" opacity="0.4"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="#00d4ff" stroke-width="1"/>
    <circle cx="0" cy="0" r="2" fill="#00d4ff" opacity="0.6"/>
  </g>

  <!-- ═══ Floating data dots ═══ -->
  <circle class="dot1" cx="860" cy="40" r="3" fill="#00d4ff" opacity="0.5"/>
  <circle class="dot2" cx="840" cy="160" r="2" fill="#00d4ff" opacity="0.3"/>
  <circle class="dot3" cx="55"  cy="90"  r="2.5" fill="#00d4ff" opacity="0.4"/>

  <!-- ═══ Scan line ═══ -->
  <g clip-path="url(#scanClip)">
    <rect class="scan-line" x="0" y="0" width="900" height="2"
          fill="url(#subGrad)" opacity="0.35" rx="1"/>
  </g>

  <!-- ═══ Main Title ═══ -->
  <text class="title-text"
        x="450" y="95"
        text-anchor="middle"
        font-family="'Courier New', 'Lucida Console', monospace"
        font-size="42"
        font-weight="700"
        letter-spacing="3"
        fill="url(#textGrad)"
        filter="url(#textGlow)">
    Kalpesh Bhoir
  </text>

  <!-- ═══ Subtitle ═══ -->
  <text class="sub-text"
        x="450" y="128"
        text-anchor="middle"
        font-family="'Courier New', 'Lucida Console', monospace"
        font-size="14"
        letter-spacing="2"
        fill="#90e0ef"
        opacity="0.9"
        filter="url(#subtleGlow)">
    AI Engineer | Computer Vision &amp; Deep Learning
  </text>

  <!-- ═══ Tag line with blinking cursor ═══ -->
  <text class="tag-text"
        x="450" y="155"
        text-anchor="middle"
        font-family="'Courier New', 'Lucida Console', monospace"
        font-size="11"
        letter-spacing="1.5"
        fill="#00d4ff"
        opacity="0.7">
    [ OpenCV · PyTorch · Deep Learning · CNNs · Real-Time AI ]<tspan class="cursor" fill="#00d4ff">_</tspan>
  </text>
</svg>
